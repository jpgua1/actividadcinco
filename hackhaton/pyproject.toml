[project]
name = "agente-estimacion"
version = "1.0.0"
description = "Agente de Estimación y Alcance - Genera artefactos completos para arranque de proyectos digitales con IA"
authors = [
    { name = "NTT DATA", email = "desarrollo@nttdata.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "project-management", "llm", "langchain", "estimacion", "gantt", "arquitectura"]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "openai>=1.6.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/nttdata/agente-estimacion"
Documentation = "https://github.com/nttdata/agente-estimacion#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
