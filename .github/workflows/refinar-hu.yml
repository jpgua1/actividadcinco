name: 🤖 Refinador de Historias de Usuario

on:
  push:
    paths:
      - 'hu/**.txt'

permissions:
  contents: write

jobs:
  refinar:
    name: Refinar HU con OpenAI
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 🔍 Detectar archivos HU modificados
        id: cambios
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'hu/*.txt' | tr '\n' ' ')
          echo "archivos=$FILES" >> $GITHUB_OUTPUT
          echo "Archivos detectados: $FILES"

      - name: ✍️ Refinar historias de usuario
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p refinada
          for FILE in ${{ steps.cambios.outputs.archivos }}; do
            echo "Refinando: $FILE"
            python scripts/refinar.py "$FILE"
          done

      - name: 💾 Commit y push de historias refinadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add refinada/
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en refinada/"
          else
            git commit -m "✅ Auto-refinamiento de HU: ${{ steps.cambios.outputs.archivos }}"
            git push
          fi
